<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Base DM Puntos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg">
<meta name="theme-color" content="#15181c">
<style>
  :root { --bg:#15181c; --fg:#e8e8e8; --mut:#9aa0a6; --ok:#4caf7d; --bad:#e0645a; --card:#1f2429; --border:#2e353c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .mut { color:var(--mut); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin:14px 0; }
  .est { font-size:18px; font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-all; font-size:13px; color:var(--mut); margin:8px 0 0; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--fg); font-size:14px; }
  button { padding:10px 14px; border-radius:8px; border:1px solid var(--ok); background:transparent; color:var(--fg); font-size:15px; margin-top:10px; }
  button.p { background:var(--ok); color:#0b0e11; border-color:var(--ok); font-weight:600; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  ol { padding-left:20px; } li { margin:4px 0; }
</style>
</head>
<body>
<h1>📍 Base DM Puntos</h1>
<div class="mut">Recibe un lugar compartido desde Google Maps y lo anota en la hoja "Puntos" para que Base DM lo tome.</div>
<div id="app"></div>
<script>
"use strict";
var CFG_KEY = 'bdm_puntos_url';
var app = document.getElementById('app');
function h(tag, attrs, kids){ var e = document.createElement(tag); Object.keys(attrs || {}).forEach(function(k){ if (k === 'onclick') e.onclick = attrs[k]; else e.setAttribute(k, attrs[k]); }); (Array.isArray(kids) ? kids : [kids]).forEach(function(c){ if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
function cfg(){ try { return localStorage.getItem(CFG_KEY) || ''; } catch(e){ return ''; } }
function pintarCfg(msg){
  var inp = h('input', { type:'url', placeholder:'https://script.google.com/macros/s/…/exec', value: cfg() });
  app.innerHTML = '';
  app.appendChild(h('div', { class:'card' }, [
    msg ? h('div', { class:'est bad' }, msg) : h('div', { class:'est' }, 'Configuración'),
    h('label', {}, 'Dirección del script de Google (la que da "Implementar → Aplicación web")'),
    inp,
    h('button', { class:'p', onclick:function(){ var v = inp.value.trim(); if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){ alert('Tiene que ser la URL que termina en /exec'); return; } try { localStorage.setItem(CFG_KEY, v); } catch(e){} pintarInicio(); } }, 'Guardar')]));
  app.appendChild(h('div', { class:'card mut' }, [
    'Cómo usar:',
    h('ol', {}, [h('li', {}, 'Instala esta página (menú del navegador → "Agregar a pantalla de inicio" / "Instalar app").'),
      h('li', {}, 'En Google Maps, en un lugar o en un pin, toca Compartir y elige "Base DM Puntos".'),
      h('li', {}, 'En Base DM › Alertas › lugares toca "📥 Traer puntos compartidos".')])]));
}
function pintarInicio(){
  app.innerHTML = '';
  app.appendChild(h('div', { class:'card' }, [h('div', { class:'est ok' }, '✓ Lista para recibir'),
    h('div', { class:'mut' }, 'Comparte un lugar desde Google Maps y elige "Base DM Puntos".'),
    h('button', { onclick:function(){ pintarCfg(); } }, '⚙ Cambiar dirección del script')]));
}
function enviar(d){
  var url = cfg();
  app.innerHTML = '';
  var est = h('div', { class:'est' }, '⏳ Anotando el punto…');
  app.appendChild(h('div', { class:'card' }, [est, h('pre', {}, [d.title, d.text, d.url].filter(Boolean).join('\n'))]));
  fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(d), redirect:'follow' })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (r && r.ok){ est.className = 'est ok'; est.textContent = '✓ Anotado: ' + (r.nombre || 'punto') + (r.lat != null ? ' (' + r.lat + ', ' + r.lon + ')' : ' (sin coordenadas: Base DM pedirá el punto)'); }
      else { est.className = 'est bad'; est.textContent = '✗ ' + ((r && r.error) || 'No se pudo anotar'); }
      app.appendChild(h('button', { onclick:function(){ history.replaceState(null, '', location.pathname); pintarInicio(); } }, 'Listo'));
    })
    .catch(function(e){ est.className = 'est bad'; est.textContent = '✗ No se pudo enviar (' + e.message + '). Revisa la dirección del script.'; app.appendChild(h('button', { onclick:function(){ pintarCfg(); } }, '⚙ Configurar')); });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
var q = new URLSearchParams(location.search);
var d = { title: q.get('title') || '', text: q.get('text') || '', url: q.get('url') || '' };
if (d.title || d.text || d.url){ if (cfg()) enviar(d); else pintarCfg('Falta configurar la dirección del script; el punto no se anotó.'); }
else if (cfg()) pintarInicio(); else pintarCfg();
</script>
</body>
</html>
